<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – QuickBite</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .orders-hero { background: linear-gradient(135deg, #fffbea 0%, #fef3c7 60%, #fde68a 100%); padding: 60px 0 40px; }
    .orders-hero h1 { font-size: 2.6rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; margin-bottom: 8px; }
    .orders-hero p { color: #78350f; font-size: 1rem; }
    .orders-content { padding: 48px 0 80px; background: var(--bg); }
    .order-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); transition: all var(--transition); }
    .order-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .order-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .order-id { font-size: 0.8rem; color: var(--text-muted); }
    .order-id strong { color: var(--text); font-size: 1rem; }
    .order-status { padding: 5px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-received { background: #fff3cd; color: #856404; }
    .status-preparing { background: #cff4fc; color: #055160; }
    .status-delivered { background: #d1e7dd; color: #0a3622; }
    .order-meta { display: flex; gap: 24px; font-size: 0.84rem; color: var(--text-muted); margin-bottom: 16px; flex-wrap: wrap; }
    .order-items-list { border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .order-item-row { display: flex; justify-content: space-between; font-size: 0.88rem; }
    .order-total-row { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
    .empty-orders { text-align: center; padding: 80px 0; color: var(--text-muted); }
    .empty-orders div { font-size: 3.5rem; margin-bottom: 16px; }
    .empty-orders h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .loading { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 1rem; }
  </style>
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-icon">🍔</span><span>QuickBite</span></a>
      <nav class="nav-links">
        <a href="menu.html">Menu</a>
        <a href="index.html#restaurants">Restaurants</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="orders.html" style="color:var(--primary)">My Orders</a>
      </nav>
      <div class="nav-actions">
        <div id="auth-area">
          <a href="index.html" class="btn btn-ghost">← Back to home</a>
        </div>
      </div>
    </div>
  </header>

  <section class="orders-hero">
    <div class="container">
      <p class="section-eyebrow" style="color:var(--primary)">Your history</p>
      <h1>My Orders</h1>
      <p>All your past QuickBite orders in one place</p>
    </div>
  </section>

  <main class="orders-content">
    <div class="container">
      <div id="orders-list"><div class="loading">Loading your orders…</div></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="orders-main.js"></script>
</body>
</html>
